name: VyaparAI CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    name: Test & Build (Monorepo)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Compile Backend TypeScript
        run: npm run build --workspace=backend

      - name: Run Backend Unit & Integration Tests (23/23 Tests)
        run: npm run test --workspace=backend

      - name: Compile & Build Frontend Assets
        run: npm run build --workspace=frontend

  docker-build:
    name: Docker Containerization Build Check
    runs-on: ubuntu-latest
    needs: test-and-build

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Compose Images
        run: docker compose build
